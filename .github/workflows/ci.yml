name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, lint, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Matches the Dockerfile, which uses `npm install` rather than `npm ci` (see the
      # comment there about lockfile checks on optional platform packages).
      - run: npm install --no-audit --no-fund

      # Route types like LayoutProps<"/"> are generated by Next, not checked in --
      # without typegen a clean checkout fails with "Cannot find name 'LayoutProps'".
      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: Unit tests
        run: npx vitest run

      - name: Production build
        run: npm run build
