services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  # Runs migrations against the `builder` image stage, which still has drizzle-kit and
  # the rest of devDependencies -- unlike `app`, whose runner stage is deliberately
  # slimmed to Next's standalone output and doesn't carry dev tooling. Not part of the
  # default `up`; run explicitly: `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    profiles: ["tools"]

  # BullMQ ingest consumer (exiftool + sharp). Runs from the `builder` stage too --
  # same reasoning as `migrate`, plus it's a long-lived Node process, not a Next.js
  # request handler, so it has no place inside `app`'s runner image at all.
  worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Node directly (with tsx as a loader) behind init's signal forwarding, rather than
    # via npx, so SIGTERM actually reaches the worker's graceful shutdown. The grace
    # period lets in-flight photos (30-90s each) finish on deploy instead of being
    # SIGKILLed after Docker's default 10s -- interrupted jobs that stalled twice were
    # failing as unrecoverable and leaving photos stuck at "processing".
    command: ["node", "--import", "tsx", "src/worker/index.ts"]
    init: true
    stop_grace_period: 3m
    # Image processing saturates every core and can spike past 1.5 GB (heic-convert's
    # WASM decoder especially). On this 2-core/4 GB box that starved the website and
    # got processes OOM-killed. cpu_shares only matters under contention -- an idle
    # site still lets the worker use every core -- but the app and database win
    # whenever both want CPU. mem_limit makes a spike kill only this container
    # (restart: unless-stopped brings it back, and BullMQ retries the job) instead of
    # the kernel picking a victim, which could be the website.
    cpu_shares: 256
    mem_limit: 1800m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"
    # Loopback-only (127.0.0.1), never 0.0.0.0 -- not reachable from the public
    # internet, only from something already on the VPS itself (an SSH tunnel
    # terminating here). Temporary, for the SmugMug import step (docs/bulk-import.md);
    # remove once that's done.
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"
    ports:
      - "127.0.0.1:6379:6379"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # The directory, not the single file: git replaces a file on pull (a new inode),
      # and a single-file bind mount keeps showing the old one until the container
      # restarts, so `caddy reload` silently re-read stale config.
      - ./caddy:/etc/caddy:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
