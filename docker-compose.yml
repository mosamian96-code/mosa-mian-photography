services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3000"

  # Runs migrations against the `builder` image stage, which still has drizzle-kit and
  # the rest of devDependencies -- unlike `app`, whose runner stage is deliberately
  # slimmed to Next's standalone output and doesn't carry dev tooling. Not part of the
  # default `up`; run explicitly: `docker compose run --rm migrate`.
  migrate:
    build:
      context: .
      target: builder
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run db:migrate
    profiles: ["tools"]

  # BullMQ ingest consumer (exiftool + sharp). Runs from the `builder` stage too --
  # same reasoning as `migrate`, plus it's a long-lived Node process, not a Next.js
  # request handler, so it has no place inside `app`'s runner image at all.
  worker:
    build:
      context: .
      target: builder
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npx tsx src/worker/index.ts

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mmp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mmp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mmp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "6379"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
